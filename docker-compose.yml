services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rgb
      POSTGRES_PASSWORD: rgb
      POSTGRES_DB: rgb
    ports:
      - "54329:5432"
    volumes:
      - rgb-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rgb -d rgb"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  rgb-db:
