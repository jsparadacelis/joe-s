[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: necesita Postgres real (DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Textos literales del PRD y SQL embebido en tests.
"app/lifecycle/domain/phases.py" = ["E501"]
"tests/**" = ["E501"]
