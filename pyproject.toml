[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["integration: necesita Postgres real (DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Textos literales del PRD y SQL embebido en tests.
"backend/app/ciclo_de_vida/domain/fases.py" = ["E501"]
"backend/tests/**" = ["E501"]
